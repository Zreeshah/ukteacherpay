<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Teacher career ladder from ECT to school leadership, 2026/27</title>
  <desc id="desc">An illustrative teacher career ladder in the rest of England, from ECT Year 1 at M1 through classroom pay, post-threshold pay, assistant head, deputy head and an indicative headteacher range.</desc>
  <metadata>SEO title: Teacher Career Ladder and Leadership Pay 2026/27. Sources: https://uk-teacherpaycalculator.co.uk/primary-school-teacher-salary/ and https://uk-teacherpaycalculator.co.uk/deputy-head-teacher-salary/</metadata>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF8EC"/><stop offset="1" stop-color="#F1F7FF"/></linearGradient><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B2545" flood-opacity=".12"/></filter><style>.title{font:700 48px Arial,sans-serif;fill:#0B2545}.sub{font:400 22px Arial,sans-serif;fill:#466075}.role{font:700 22px Arial,sans-serif;fill:#0B2545}.point{font:700 18px Arial,sans-serif;fill:#1F8A70}.pay{font:700 25px Arial,sans-serif;fill:#0B2545}.note{font:400 16px Arial,sans-serif;fill:#466075}.foot{font:400 15px Arial,sans-serif;fill:#466075}</style></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect x="64" y="54" width="12" height="84" rx="6" fill="#F19C38"/>
  <text x="100" y="92" class="title">A teacher’s route to leadership</text><text x="100" y="126" class="sub">Illustrative milestones · rest of England · gross annual salary · 2026/27</text>
  <text x="100" y="200" class="note">Pay progression is not automatic: it depends on performance, a threshold application, role availability, and the school’s pay policy.</text>
  <g fill="none" stroke="#F19C38" stroke-width="8" stroke-linecap="round"><path d="M188 495H1415"/></g>
  <g fill="#F19C38"><path d="M1410 482l28 13-28 13z"/></g>
  <g filter="url(#s)">
    <rect x="86" y="362" width="204" height="208" rx="18" fill="#fff"/><rect x="326" y="330" width="204" height="240" rx="18" fill="#fff"/><rect x="566" y="298" width="204" height="272" rx="18" fill="#fff"/><rect x="806" y="266" width="204" height="304" rx="18" fill="#fff"/><rect x="1046" y="234" width="204" height="336" rx="18" fill="#fff"/><rect x="1286" y="202" width="204" height="368" rx="18" fill="#0B2545"/>
  </g>
  <g text-anchor="middle">
    <text x="188" y="412" class="role">ECT year 1</text><text x="188" y="444" class="point">M1</text><text x="188" y="486" class="pay">£34,068</text><text x="188" y="524" class="note">First year of</text><text x="188" y="546" class="note">induction</text>
    <text x="428" y="388" class="role">Classroom</text><text x="428" y="416" class="role">teacher</text><text x="428" y="452" class="point">M6</text><text x="428" y="494" class="pay">£46,939</text><text x="428" y="532" class="note">Top of the main</text><text x="428" y="554" class="note">pay range</text>
    <text x="668" y="356" class="role">Post-threshold</text><text x="668" y="392" class="point">U3</text><text x="668" y="434" class="pay">£52,835</text><text x="668" y="474" class="note">Upper pay range;</text><text x="668" y="496" class="note">threshold required</text>
    <text x="908" y="324" class="role">Assistant head</text><text x="908" y="360" class="point">L9</text><text x="908" y="402" class="pay">£65,095</text><text x="908" y="442" class="note">Average-secondary</text><text x="908" y="464" class="note">illustrative point</text>
    <text x="1148" y="292" class="role">Deputy head</text><text x="1148" y="328" class="point">L15</text><text x="1148" y="370" class="pay">£75,322</text><text x="1148" y="410" class="note">Average-secondary</text><text x="1148" y="432" class="note">illustrative point</text><text x="1148" y="486" class="note">+£10,227 vs L9</text>
    <text x="1388" y="260" style="font:700 22px Arial,sans-serif;fill:#fff">Headteacher</text><text x="1388" y="296" style="font:700 18px Arial,sans-serif;fill:#BFD8D1">L21–L27</text><text x="1388" y="338" style="font:700 24px Arial,sans-serif;fill:#fff">£87,157–</text><text x="1388" y="370" style="font:700 24px Arial,sans-serif;fill:#fff">£100,851</text><text x="1388" y="412" style="font:400 16px Arial,sans-serif;fill:#BFD8D1">Indicative average</text><text x="1388" y="434" style="font:400 16px Arial,sans-serif;fill:#BFD8D1">secondary ISR</text>
  </g>
  <g><rect x="100" y="666" width="1400" height="76" rx="16" fill="#FFF" stroke="#DCE7F3"/><text x="130" y="712" class="role">Illustrative route:</text><text x="360" y="712" class="note">Primary teacher pay points share the same England scales. Leadership salaries vary by school group, individual school range, and region.</text></g>
  <line x1="100" y1="790" x2="1500" y2="790" stroke="#CBD9E6"/><text x="100" y="828" class="foot">Sources: UK Teacher Pay Calculator — Primary School Teacher Salary, Deputy Head Teacher Salary, and Head Teacher Salary · 2026/27</text><text x="100" y="858" class="foot">uk-teacherpaycalculator.co.uk/primary-school-teacher-salary/ · /deputy-head-teacher-salary/ · /head-teacher-salary/</text>
</svg>
