  <rect x="100" y="190" width="670" height="82" rx="24" fill="#1F8A70"/><rect x="830" y="190" width="670" height="82" rx="24" fill="#0B2545"/>
  <text x="134" y="241" class="white">NEU-published rates: +3.5%</text><text x="864" y="241" class="white">Northern Ireland vs rest of England</text>
  <text x="134" y="315" class="panel">Selected 2025/26 → 2026/27 changes</text><text x="864" y="315" class="panel">Main-range pay gap in 2026/27</text>
  <g transform="translate(134 360)"><g class="label"><text x="0" y="0">M1</text><text x="0" y="72">M6</text><text x="0" y="144">U3</text><text x="0" y="216">TLR 2 minimum</text></g><g text-anchor="end" class="num"><text x="228" y="0">≈£32,916</text><text x="228" y="72">≈£45,352</text><text x="228" y="144">≈£51,048</text><text x="228" y="216">≈£3,527</text></g><g fill="none" stroke="#AFCFC4" stroke-width="5"><path d="M252 0h68"/><path d="M252 72h68"/><path d="M252 144h68"/><path d="M252 216h68"/></g><g fill="#1F8A70"><path d="M316-12l26 12-26 12z"/><path d="M316 60l26 12-26 12z"/><path d="M316 132l26 12-26 12z"/><path d="M316 204l26 12-26 12z"/></g><g class="num"><text x="364" y="0">£34,068</text><text x="364" y="72">£46,939</text><text x="364" y="144">£52,835</text><text x="364" y="216">£3,650</text></g><g text-anchor="end" class="small"><text x="582" y="0">+3.5%</text><text x="582" y="72">+3.5%</text><text x="582" y="144">+3.5%</text><text x="582" y="216">+3.5%</text></g></g>
