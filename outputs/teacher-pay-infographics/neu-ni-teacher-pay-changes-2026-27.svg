<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Teacher pay changes 2026/27: NEU published rate rise and Northern Ireland pay gap</title>
  <desc id="desc">A two-panel infographic. The left panel shows selected NEU-published rates rising by 3.5 percent in 2026/27. The right panel compares Northern Ireland main-range pay with rest-of-England pay at points 1, 3 and 6.</desc>
  <metadata>SEO title: NEU Teacher Pay Rise and Northern Ireland Pay Gap 2026/27. Sources: https://uk-teacherpaycalculator.co.uk/neu-teacher-pay-scales/ and https://uk-teacherpaycalculator.co.uk/ni-teacher-pay-scale/</metadata>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F6F9FE"/><stop offset="1" stop-color="#FFF7ED"/></linearGradient><style>.title{font:700 48px Arial,sans-serif;fill:#0B2545}.sub{font:400 22px Arial,sans-serif;fill:#466075}.panel{font:700 27px Arial,sans-serif;fill:#0B2545}.label{font:700 18px Arial,sans-serif;fill:#0B2545}.num{font:700 21px Arial,sans-serif;fill:#0B2545}.small{font:400 16px Arial,sans-serif;fill:#466075}.white{font:700 18px Arial,sans-serif;fill:#fff}.foot{font:400 15px Arial,sans-serif;fill:#466075}</style></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect x="64" y="54" width="12" height="84" rx="6" fill="#D85B6B"/>
  <text x="100" y="92" class="title">What changed in teacher pay for 2026/27?</text><text x="100" y="126" class="sub">Selected published comparisons · full-time gross annual figures</text>
