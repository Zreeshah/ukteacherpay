<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">UK teacher salary comparison by nation and England region, 2026/27</title>
  <desc id="desc">A range comparison chart for teacher starting and top classroom salaries across rest of England, inner London, Wales, Scotland and Northern Ireland in 2026/27.</desc>
  <metadata>SEO title: UK Teacher Salary Comparison 2026/27. Source: https://uk-teacherpaycalculator.co.uk/teacher-salary-uk/</metadata>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#F1F8FF"/><stop offset="1" stop-color="#F8F4FF"/></linearGradient><style>.title{font:700 48px Arial,sans-serif;fill:#0B2545}.sub{font:400 22px Arial,sans-serif;fill:#466075}.row{font:700 22px Arial,sans-serif;fill:#0B2545}.money{font:700 19px Arial,sans-serif;fill:#0B2545}.small{font:400 17px Arial,sans-serif;fill:#466075}.tick{font:400 16px Arial,sans-serif;fill:#466075}.foot{font:400 15px Arial,sans-serif;fill:#466075}</style></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect x="64" y="54" width="12" height="84" rx="6" fill="#3182CE"/>
  <text x="100" y="92" class="title">UK teacher salary comparison</text><text x="100" y="126" class="sub">Starting to top classroom salary · full-time gross pay · 2026/27</text>
  <g transform="translate(440 224)"><line x1="0" y1="0" x2="980" y2="0" stroke="#C9D7E8"/><g class="tick" text-anchor="middle"><text x="0" y="-16">£30k</text><text x="280" y="-16">£40k</text><text x="560" y="-16">£50k</text><text x="840" y="-16">£60k</text></g><g stroke="#DCE7F1" stroke-dasharray="4 8"><line x1="0" y1="20" x2="0" y2="470"/><line x1="280" y1="20" x2="280" y2="470"/><line x1="560" y1="20" x2="560" y2="470"/><line x1="840" y1="20" x2="840" y2="470"/></g>
    <g><line x1="114" y1="70" x2="640" y2="70" stroke="#1F8A70" stroke-width="24" stroke-linecap="round"/><circle cx="114" cy="70" r="15" fill="#0B2545"/><circle cx="640" cy="70" r="15" fill="#0B2545"/><text x="114" y="112" text-anchor="middle" class="money">£34,068</text><text x="640" y="112" text-anchor="middle" class="money">£52,835</text></g>
    <g><line x1="328" y1="160" x2="970" y2="160" stroke="#6C4CCF" stroke-width="24" stroke-linecap="round"/><circle cx="328" cy="160" r="15" fill="#0B2545"/><circle cx="970" cy="160" r="15" fill="#0B2545"/><text x="328" y="202" text-anchor="middle" class="money">£41,728</text><text x="970" y="202" text-anchor="middle" class="money">£64,683</text></g>
    <g><line x1="114" y1="250" x2="640" y2="250" stroke="#E69C32" stroke-width="24" stroke-linecap="round"/><circle cx="114" cy="250" r="15" fill="#0B2545"/><circle cx="640" cy="250" r="15" fill="#0B2545"/><text x="114" y="292" text-anchor="middle" class="money">£34,068</text><text x="640" y="292" text-anchor="middle" class="money">£52,835</text></g>
    <g><line x1="127" y1="340" x2="632" y2="340" stroke="#3182CE" stroke-width="24" stroke-linecap="round"/><circle cx="127" cy="340" r="15" fill="#0B2545"/><circle cx="632" cy="340" r="15" fill="#0B2545"/><text x="127" y="382" text-anchor="middle" class="money">£34,539</text><text x="632" y="382" text-anchor="middle" class="money">£52,539*</text></g>
    <g><line x1="61" y1="430" x2="562" y2="430" stroke="#D85B6B" stroke-width="24" stroke-linecap="round"/><circle cx="61" cy="430" r="15" fill="#0B2545"/><circle cx="562" cy="430" r="15" fill="#0B2545"/><text x="61" y="472" text-anchor="middle" class="money">£32,188</text><text x="562" y="472" text-anchor="middle" class="money">£50,085</text></g></g>
  <g class="row" text-anchor="end"><text x="400" y="300">England (rest)</text><text x="400" y="390">England (inner London)</text><text x="400" y="480">Wales</text><text x="400" y="570">Scotland</text><text x="400" y="660">Northern Ireland</text></g>
  <g><rect x="100" y="714" width="1400" height="54" rx="14" fill="#fff"/><text x="128" y="749" class="small">* Scotland figure shown is the Chartered Teacher ceiling. England and Wales share the same listed M1 and U3 figures; local pay policy still applies.</text></g>
  <line x1="100" y1="804" x2="1500" y2="804" stroke="#C9D7E8"/><text x="100" y="840" class="foot">Source: UK Teacher Pay Calculator, “Teacher Salary UK 2026/27” · figures are gross, full-time annual salary</text><text x="100" y="866" class="foot">uk-teacherpaycalculator.co.uk/teacher-salary-uk/</text>
</svg>
